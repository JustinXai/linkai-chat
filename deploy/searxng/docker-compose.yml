# SearXNG Docker Compose Configuration
# 只监听本机 127.0.0.1:8888，不暴露公网
#
# 部署命令:
#   cd deploy/searxng
#   docker compose up -d
#
# 验证命令:
#   curl "http://127.0.0.1:8888/search?q=OpenAI最新模型&format=json"

services:
  searxng:
    image: searxng/searxng:latest
    container_name: linkai-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    networks:
      - searxng-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  searxng-network:
    driver: bridge
